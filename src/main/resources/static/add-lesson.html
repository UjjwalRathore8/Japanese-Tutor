
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Lesson | Trainer Portal</title>
    <link rel="stylesheet" href="/css/add-lesson.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📖 Add Lesson</h2>
    </div>

    <div class="content">
        <div class="form-group">
            <label>Lesson Title</label>
            <input type="text" id="title" placeholder="Enter lesson title">
        </div>

        <div class="form-group">
            <label>Lesson Type</label>
            <input type="text" id="type" placeholder="e.g. Hiragana">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="description" placeholder="Lesson description"></textarea>
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea id="content" placeholder="Lesson content"></textarea>
        </div>

        <div class="form-group">
            <label>Lesson Words / Pronunciation</label>
            <div id="wordsContainer"></div>
            <button type="button" class="btn-small" onclick="addWordField()">+ Add Word</button>
        </div>

        <button class="btn-submit" id="submitBtn">➕ Add Lesson</button>

        <div id="message" class="message"></div>
    </div>
</div>

<script src="/js/add-lesson.js"></script>
</body>
</html>
