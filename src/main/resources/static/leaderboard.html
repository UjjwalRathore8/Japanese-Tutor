<div class="container">
    <div class="header">
        <h2>Leaderboard</h2>
        <div class="sub">Top performers · valid users only</div>
    </div>
    <div class="content">
        <div id="leaderboardContainer">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading rankings...</p>
            </div>
        </div>
        <div class="btn-back">
            <button onclick="location.href='/dashboard.html'">← Back to Dashboard</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const container = document.getElementById("leaderboardContainer");
        const token = localStorage.getItem("token");

        // Show loading
        function showLoading() {
            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading rankings...</p>
                </div>
            `;
        }

        // Show empty / no users
        function showEmpty() {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">👥</div>
                    <p>No valid users found</p>
                    <p style="font-size: 0.75rem; margin-top: 0.3rem;">Scores will appear once users exist</p>
                </div>
            `;
        }

        // Show error
        function showError(msg) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 2rem;">⚠️</div>
                    <p style="color: #b91c1c;">${msg}</p>
                </div>
            `;
        }

        // Render leaderboard from valid users only (filter out null/invalid entries)
        function renderLeaderboard(users) {
            // Filter: only keep users with valid name and valid score (number)
            const validUsers = users.filter(user => {
                return user && 
                       user.name && 
                       user.name.trim() !== "" &&
                       typeof user.score === 'number' &&
                       !isNaN(user.score);
            });

            if (validUsers.length === 0) {
                showEmpty();
                return;
            }

            // Sort by score descending
            validUsers.sort((a, b) => b.score - a.score);

            // Build HTML
            let html = `<div class="leaderboard-list">`;
            
            validUsers.forEach((user, idx) => {
                const rank = idx + 1;
                let rankClass = "";
                if (rank === 1) rankClass = "rank-1";
                else if (rank === 2) rankClass = "rank-2";
                else if (rank === 3) rankClass = "rank-3";
                
                html += `
                    <div class="leaderboard-item">
                        <div class="rank ${rankClass}">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`}</div>
                        <div class="user-info">
                            <div class="user-name">${escapeHtml(user.name)}</div>
                            <div class="user-email">${escapeHtml(user.email || '')}</div>
                        </div>
                        <div class="score">${user.score} pts</div>
                    </div>
                `;
            });
            
            html += `</div>`;
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Fetch leaderboard from API
        async function fetchLeaderboard() {
            showLoading();

            const headers = { 'Content-Type': 'application/json' };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
